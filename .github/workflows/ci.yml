name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci
      - name: Validate proposed session contract
        run: node ../docs/session-manager/validate.cjs
      - run: npm test
      - run: npm run build

  ios:
    # macos-latest still selects Xcode 26. The Siri system schema and testing
    # framework require the iOS 27 SDK on GitHub's dedicated Xcode image.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install gitleaks xcodegen
      - name: Verify release privacy
        run: /bin/bash scripts/verify-release-privacy.sh
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -version
      - name: Build and test on simulator
        run: >-
          xcodebuild -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBrief
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro'
          CODE_SIGN_IDENTITY=-
          test
      - name: Test Siri through system App Intents
        run: >-
          xcodebuild -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBriefSiri
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro'
          -skip-testing:RuntimeBriefSiriTests/SiriIntegrationUITests/testLiveSiriCreatesNativeSessions
          CODE_SIGN_IDENTITY=-
          test
