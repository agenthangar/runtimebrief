name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci
      - name: Validate proposed session contract
        run: node ../docs/session-manager/validate.cjs
      - run: npm test
      - run: npm run build

  ios:
    # macos-latest still selects Xcode 26. The Siri system schema and testing
    # framework require the iOS 27 SDK on GitHub's dedicated Xcode image.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install gitleaks xcodegen
      - name: Verify release privacy
        run: /bin/bash scripts/verify-release-privacy.sh
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -version
      - name: Select an available iOS 27 iPhone
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, entries in devices.items() if ".iOS-27-" in runtime for d in entries if d["name"].startswith("iPhone") and d["isAvailable"]))')"
          echo "IOS_TEST_DEVICE=$device_id" >> "$GITHUB_ENV"
      - name: Build and test on simulator
        # Xcode 27 can wait ten minutes collecting simulator sysdiagnoses even
        # after all tests pass. Keep test results and attached screenshots.
        run: >-
          xcodebuild -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBrief
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${IOS_TEST_DEVICE}"
          -collect-test-diagnostics never
          CODE_SIGN_IDENTITY=-
          test
      - name: Test Siri through system App Intents
        run: >-
          xcodebuild -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBriefSiri
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${IOS_TEST_DEVICE}"
          -skip-testing:RuntimeBriefSiriTests/SiriIntegrationUITests/testLiveSiriCreatesNativeSessions
          -collect-test-diagnostics never
          CODE_SIGN_IDENTITY=-
          test

  ios-siri-routing:
    # Keep recognized-text routing separate from direct App Intents tests so a
    # Siri indexing failure cannot be mistaken for a passing shortcut action.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Select an available iOS 27 iPhone
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, entries in devices.items() if ".iOS-27-" in runtime for d in entries if d["name"].startswith("iPhone") and d["isAvailable"]))')"
          echo "IOS_TEST_DEVICE=$device_id" >> "$GITHUB_ENV"
      - name: Boot and settle the simulator before UI testing
        run: xcrun simctl bootstatus "$IOS_TEST_DEVICE" -b
      - name: Route recognized status phrases through Siri
        run: >-
          xcodebuild -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBriefSiri
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${IOS_TEST_DEVICE}"
          -only-testing:RuntimeBriefSiriTests/SiriVoiceRoutingUITests
          -resultBundlePath "$RUNNER_TEMP/siri-routing.xcresult"
          -collect-test-diagnostics never
          RUNTIMEBRIEF_E2E_SIRI_ROUTING=1
          CODE_SIGN_IDENTITY=-
          test
      - name: Save Siri response screenshots and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siri-routing-xcresult
          path: ${{ runner.temp }}/siri-routing.xcresult
          if-no-files-found: ignore
