name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            # CodeQL currently supports Swift through 6.3. The release and
            # system App Intents tests use Xcode 27 in ci.yml.
            runner: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure Rosetta is available for CodeQL compiler tracing
        if: matrix.language == 'swift'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Select the supported Swift security analysis toolchain
        if: matrix.language == 'swift'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Generate the Xcode project
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages before compiler tracing
        if: matrix.language == 'swift'
        run: >-
          xcodebuild -resolvePackageDependencies
          -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBrief
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the iOS app for Swift analysis
        if: matrix.language == 'swift'
        run: >-
          xcodebuild
          -project ios/RuntimeBrief.xcodeproj
          -scheme RuntimeBrief
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=YES
          ARCHS=arm64
          build

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
